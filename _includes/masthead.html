<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav class="site-navigation" aria-label="Main navigation">
        <a class="site-navigation__brand" href="{{ '/' | relative_url }}" target="_self">Zelang Wen</a>
        <ul class="site-navigation__links">
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}" target="_self">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </div>
</div>
